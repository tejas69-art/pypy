# ─────────────────────────────────────────────────────────────────────────────
# CI + CD Workflow — Backend (pypy / FastAPI)
# File: .github/workflows/backend-pipeline.yml
# CI runs on PRs; CD runs on push to main
#
# Required Secrets:
#   AWS_ACCESS_KEY_ID       — IAM user key
#   AWS_SECRET_ACCESS_KEY   — IAM user secret
#   AWS_ACCOUNT_ID          — 12-digit account number
# ─────────────────────────────────────────────────────────────────────────────
name: 🐍 Backend — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION:      ap-south-1
  ECR_REPOSITORY:  vtu-backend
  ECS_CLUSTER:     vtu-results-cluster
  ECS_SERVICE:     vtu-backend-service
  CONTAINER_NAME:  vtu-backend

jobs:

  # ─── Job 1: Python CI (always runs) ─────────────────────────────────────────
  ci:
    name: 🐍 Python Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 📦 Install lint deps
        run: pip install ruff

      - name: 🔍 Ruff lint check
        run: |
          ruff check . --select E,W,F --ignore E501,E402 \
            --output-format=github || \
            echo "⚠️ Lint warnings found"

      - name: ✅ Verify imports & syntax
        run: |
          python3 -m py_compile main.py
          echo "✅ main.py syntax OK"

      - name: 📋 Print FastAPI route summary
        run: |
          echo "📋 Application entry point: main.py"
          echo "🌐 Routes: / | /about | /single-post | /docs"
          grep -n "@app\." main.py || echo "(routes listed above)"

  # ─── Job 2: Docker Build + ECR Push (main branch only) ─────────────────────
  build-push:
    name: 🐳 Docker Build → ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: 🔐 Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms: linux/amd64

      - name: 📋 Print image details
        run: |
          echo "✅ Backend image pushed:"
          echo "   ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

  # ─── Job 3: Deploy to ECS Fargate ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Backend → ECS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-push

    steps:
      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: 🔐 Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📋 Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            --output json > task-definition.json

      - name: 🔄 Render new task definition with updated image
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: 🚀 Rolling deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.render-task.outputs.task-definition }}
          service:                    ${{ env.ECS_SERVICE }}
          cluster:                    ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: ❤️ Health Check
        run: |
          RUNNING=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].runningCount' --output text)
          DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].desiredCount' --output text)

          echo "╔══════════════════════════════════════════╗"
          echo "║  ✅ BACKEND DEPLOYED SUCCESSFULLY        ║"
          echo "║  Running: $RUNNING / Desired: $DESIRED   ║"
          echo "║  Commit : ${{ github.sha }}"
          echo "║  Actor  : ${{ github.actor }}"
          echo "╚══════════════════════════════════════════╝"

